name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Compile and Test with Maven
        run: ./mvnw clean test -B

      - name: Build Production JAR
        run: ./mvnw package -DskipTests -B

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: serbisyoko-backend-jar
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Build Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run / Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: serbisyoko-web:latest
