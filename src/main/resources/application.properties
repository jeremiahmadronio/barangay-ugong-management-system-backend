spring.application.name=barangay

#database configuration
spring.datasource.url= ${DB_URL}
spring.datasource.username= ${DB_USERNAME}
spring.datasource.password= ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#email credentials
spring.mail.host=smtp.gmail.com
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



#database backup
DO_SPACES_KEY=${DO_SPACES_KEY}
DO_SPACES_SECRET=${DO_SPACES_SECRET}
DO_SPACES_ENDPOINT=${DO_SPACES_ENDPOINT}
DO_SPACES_REGION=${DO_SPACES_REGION}
backup.master-passphrase=${BACKUP_MASTER_PASSPHRASE}
spaces.bucket.name=${DO_BUCKET_NAME}


#root admin credentials
app.setup.admin-email=${ROOT_EMAIL}
app.setup.admin-password=${ROOT_PASSWORD}

#jwt
jwt.secret-key=${JWT_SECRET}
jwt.expiration=86400000


app.root.password=${ROOT_PASSWORD}

#encryption key
app.encryption.secret-key=${ENCRYPT_KEY}


#capacity
spring.datasource.hikari.maximum-pool-size=25
#always ready
spring.datasource.hikari.minimum-idle=5
#30s waiting
spring.datasource.hikari.connection-timeout=30000
#10mins stop db connection if 10 mins no action
spring.datasource.hikari.idle-timeout=600000
# Auto-refresh connections every 30 mins to ensure database stability.
spring.datasource.hikari.max-lifetime=1800000
# Threshold to report potential connection leaks (6 seconds).
spring.datasource.hikari.leak-detection-threshold=6000