spring.application.name=barangay-test

# Isolated in-memory datasource for tests
spring.datasource.url=jdbc:h2:mem:barangay_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.seed.enabled=false

# Minimal values for @Value placeholders during context boot
app.setup.admin-email=test-admin@example.com
app.setup.admin-password=test-admin-password
jwt.secret-key=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
app.encryption.secret-key=MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=
ROOT_EMAIL=test-root@example.com
ROOT_PASSWORD=test-root-password

SMTP_PORT=2525
SMTP_USERNAME=test-smtp-user
SMTP_PASSWORD=test-smtp-password
DO_SPACES_KEY=test-key
DO_SPACES_SECRET=test-secret
DO_SPACES_ENDPOINT=http://localhost
DO_SPACES_REGION=us-east-1
BACKUP_MASTER_PASSPHRASE=test-passphrase
DO_BUCKET_NAME=test-bucket
CORS_ALLOWED_ORIGINS=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
